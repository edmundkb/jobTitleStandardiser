spring:
  application:
    title: jobTitleStandardiser
  cache:
    cache-titles: job-normaliser-cache
    caffeine:
      spec: maximumSize=500,expireAfterAccess=5m

logging:
  level:
    org.springframework.cache: debug
    com.github.benmanes.caffeine: debug

jobs:
